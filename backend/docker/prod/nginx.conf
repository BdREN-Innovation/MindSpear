# The backend-web container. The server's own nginx terminates TLS and proxies here.

# Laravel has no trusted-proxy setup, so tell it directly what the visitor used: HTTPS makes it
# generate https:// URLs, and the real address (below) keeps per-IP rate limits per visitor
# rather than shared by everyone.
map $http_x_forwarded_proto $forwarded_https {
    https   on;
    default "";
}

server {
    listen 80;
    root /app/public;
    index index.php;

    client_max_body_size 64M;

    # Only reachable through the published 127.0.0.1 port, so the sender is the host's nginx.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;

    # Look php-fpm up on each request: its address changes when the container is recreated.
    resolver 127.0.0.11 valid=10s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        set $php_upstream backend:9000;
        fastcgi_pass $php_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param HTTPS $forwarded_https if_not_empty;
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known) { deny all; }
    location ~ \.php$ { return 404; }
}
