; Loaded after php.ini-production (Dockerfile.prod).

expose_php = Off
date.timezone = UTC
max_execution_time = 120

; Laravel reads the container's environment.
variables_order = EGPCS

; My Files uploads: videos up to 50 MB (config/file_library.php) plus form overhead.
upload_max_filesize = 60M
post_max_size = 64M
memory_limit = 512M

; The code only changes when the image is rebuilt, so don't re-check files on every request.
opcache.enable = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
