services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mindspear
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - mindspear
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mindspear"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - mindspear
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env.docker
    environment:
      # Several workers so long uploads don't block other requests
      PHP_CLI_SERVER_WORKERS: 4
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # artisan serve's request workers read /app/.env, not container env vars
      - ./backend/.env.docker:/app/.env
      - /app/vendor
    networks:
      - mindspear
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "php artisan config:clear &&
             until php -r \"new PDO('pgsql:host=postgres;port=5432;dbname=mindspear', 'myuser', 'mypassword');\" 2>/dev/null; do echo 'Waiting for postgres...'; sleep 2; done &&
             php artisan migrate --force &&
             (php artisan tinker --execute='exit(App\\Models\\User::count() === 0 ? 0 : 1);' && php artisan db:seed --force || echo 'Seed skipped (DB already has users)') &&
             php artisan storage:link --force &&
             php artisan serve --host=0.0.0.0 --port=8000"

  reverb:
    build: ./backend
    env_file: ./backend/.env.docker
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      # artisan serve's request workers read /app/.env, not container env vars
      - ./backend/.env.docker:/app/.env
      - /app/vendor
    networks:
      - mindspear
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: php artisan reverb:start --host=0.0.0.0 --port=8080

  # Fun Games: locks questions, opens the next one and ends games on the server clock.
  # Exits hourly (--max-runtime) and is restarted fresh.
  fungames-ticker:
    build: ./backend
    env_file: ./backend/.env.docker
    volumes:
      - ./backend:/app
      # artisan serve's request workers read /app/.env, not container env vars
      - ./backend/.env.docker:/app/.env
      - /app/vendor
    networks:
      - mindspear
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    command: php artisan fun-games:tick --loop --max-runtime=3600

  # Fun Games: scores finished games. Only the "fungames" queue, so it doesn't
  # pick up other queued work. If it isn't running, the ticker scores a game
  # itself about 10 s after it ends.
  fungames-queue:
    build: ./backend
    env_file: ./backend/.env.docker
    volumes:
      - ./backend:/app
      # artisan serve's request workers read /app/.env, not container env vars
      - ./backend/.env.docker:/app/.env
      - /app/vendor
    networks:
      - mindspear
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    command: php artisan queue:work redis --queue=fungames --tries=3 --max-time=3600

  frontend:
    build: ./frontend
    env_file: ./frontend/.env
    environment:
      # Server-side (SSR / route handler) calls reach Laravel over the docker network.
      INTERNAL_API_BASE_URL: http://backend:8000/api/v1
      # NEXT_PUBLIC_* run in the browser, which is outside the docker network,
      # so they use the host-published ports.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_REVERB_HOST: localhost
      NEXT_PUBLIC_REVERB_PORT: 8080
      NEXT_PUBLIC_APP_URL: http://localhost:2000
    ports:
      - "2000:2000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - mindspear
    depends_on:
      - backend
      - reverb

networks:
  mindspear:
    driver: bridge

volumes:
  pgdata:
