# Site for the server's own nginx: one public domain, routed by path to docker-compose.prod.yml
# (and /grafana/ to monitoring/docker-compose.yml). The ports must match the "127.0.0.1:..."
# ports in docker-compose.prod.yml, and GRAFANA_PORT in monitoring/.env.
#
#   sudo cp deploy/nginx/dev.mindspear.app.conf /etc/nginx/sites-available/dev.mindspear.app
#   sudo ln -sf /etc/nginx/sites-available/dev.mindspear.app /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d dev.mindspear.app --redirect    # adds HTTPS to this file's copy

upstream mindspear_frontend { server 127.0.0.1:3100; }
upstream mindspear_backend  { server 127.0.0.1:8100; }
upstream mindspear_reverb   { server 127.0.0.1:8180; }
upstream mindspear_ai       { server 127.0.0.1:8101; }
upstream mindspear_grafana  { server 127.0.0.1:3200; }

server {
    listen 80;
    listen [::]:80;
    server_name dev.mindspear.app;

    client_max_body_size 64M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Live websockets: wss://dev.mindspear.app/app/<key>
    location ^~ /app/ {
        proxy_pass http://mindspear_reverb;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Laravel: the API, private channel auth and health check. /api/v1 only, because Next.js has
    # its own /api routes.
    location ^~ /api/v1             { proxy_pass http://mindspear_backend; proxy_read_timeout 120s; }
    location = /broadcasting/auth   { proxy_pass http://mindspear_backend; }
    location = /up                  { proxy_pass http://mindspear_backend; }

    # Laravel: the admin panel and its assets, and uploaded files.
    location ^~ /super-admin        { proxy_pass http://mindspear_backend; }
    location ^~ /livewire           { proxy_pass http://mindspear_backend; }
    location ^~ /storage/           { proxy_pass http://mindspear_backend; }
    location ^~ /build/             { proxy_pass http://mindspear_backend; }
    location ^~ /css/filament/      { proxy_pass http://mindspear_backend; }
    location ^~ /js/filament/       { proxy_pass http://mindspear_backend; }
    location = /images/mindspear_logo.svg { proxy_pass http://mindspear_backend; }
    location = /images/favicon.svg  { proxy_pass http://mindspear_backend; }

    # The AI server, with the /ai-api prefix removed. A generation with a top-up can take minutes.
    location ^~ /ai-api/ {
        proxy_pass http://mindspear_ai/;
        proxy_read_timeout 300s;
    }

    # Grafana (monitoring/), with its own login. It runs with GF_SERVER_SERVE_FROM_SUB_PATH=true,
    # so the /grafana prefix is passed on unchanged: no trailing slash after the upstream.
    # api/live/ is the websocket that refreshes dashboards live.
    location = /grafana { return 301 /grafana/; }
    location ^~ /grafana/api/live/ {
        proxy_pass http://mindspear_grafana;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
    location ^~ /grafana/ {
        proxy_pass http://mindspear_grafana;
        proxy_read_timeout 60s;
    }

    # Everything else is the Next.js app.
    location / {
        proxy_pass http://mindspear_frontend;
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/dev.mindspear.app.access.log;
    error_log  /var/log/nginx/dev.mindspear.app.error.log;
}
